name: chisha
description: "吃啥 —— 今天吃什么的随机推荐桌面应用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 打开系统默认浏览器跳转抖音搜索页
  url_launcher: ^6.3.0
  # 定位"数据保存位置"（软件数据目录）
  path_provider: ^2.1.4
  # 拼接跨平台路径
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/placeholder/
    # 免费图库下载的菜品图片（《增加功能.docx》第 2 条）
    - assets/dishes/
    # 图片来源与署名；CC BY-SA 等许可要求署名，随包提供以便应用内展示
    - assets/credits.md
